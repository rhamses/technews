name: Ingest feeds

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull content from R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run content:pull

      - name: Ingest feeds
        id: ingest
        run: npm run ingest

      - name: Push content to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run content:push

      - name: Build site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm

      - name: Notify push subscribers
        env:
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
          ADDED: ${{ steps.ingest.outputs.added }}
        run: |
          if [ -z "$PUSH_NOTIFY_SECRET" ]; then
            echo "PUSH_NOTIFY_SECRET not set; skipping notify."
            exit 0
          fi
          COUNT="${ADDED:-0}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${PUSH_NOTIFY_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"added\": ${COUNT}}" \
              "https://technews.amb1.workers.dev/api/push/notify"; then
              echo
              echo "Notify succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Notify attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "Notify failed after retries."
          exit 1
