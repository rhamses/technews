name: Ingest feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest feeds
        run: npm run ingest

      - name: Commit ingested content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/checkpoints.json src/content/articles
          if git diff --staged --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "chore: ingest RSS feeds"
          git push
